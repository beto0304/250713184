<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div id="formulir">
    <h1>Formulir Event PSM</h1>

    <form action="" method="post" enctype="multipart/form-data">

        <h3>Data diri</h3>
        <table cellspacing="4" cellpadding="4" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="nama"><strong>Nama Lengkap</strong></label>
                </td>
                <td>
                    <input type="text" id="nama" name="nama" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="nim"><strong>NIM (diluar atma silahkan diberi "-")</strong></label>
                </td>
                <td>
                    <input type="text" id="nim" name="nim" size="30" />
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="prodi"><strong>Tau PSM dari mana?</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option value="Informatika">Instagram</option>
                        <option value="Sistem Informasi">Tiktok</option>
                        <option value="Teknik Industri">Youtube</option>
                    </select>
                </td>
            </tr>
        </table>
        <h3>Pilihan Paket</h3>
        <table class="kotak" cellspacing="4" cellpadding="4" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <input type="radio" id="reguler" name="tiket" value="Reguler" /><label for="reguler">Reguler</label>
                    <input type="radio" id="vip" name="tiket" value="VIP" /><label for="vip">VIP</label>
                </td>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Topik Seminar</strong>
                </td>
                <td>
                    <input type="checkbox" id="paket1" name="paket" value="Paket Bucin (Dapat Aqua)" /><label for="paket1">Paket 2 Orang (Dapat Aqua)</label><br />
                    <input type="checkbox" id="paket2" name="paket" value="Paket Keluarga kecil (Dapat Dancow)" /><label for="paket2">Paket Keluarga kecil (Dapat Dancow)</label><br />
                    <input type="checkbox" id="paket3" name="paket" value="Paket Keluarga Besar (Dapat Pizza)" /><label for="paket3">Paket Keluarga Besar (Dapat Pizza)</label>
                </td>
            </tr>
        </table>
        <h3>Informasi Tambahan</h3>
        <table cellspacing="4" cellpadding="4" style="border-collapse:collapse; width:100%;">
            <tr>
                <td style="width:32%;">
                    <label for="bukti"><strong>Bukti Pembayaran</strong></label>
                </td>
                <td>
                    <input type="file" id="bukti" name="bukti" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" name="simpan" value="Simpan" class="tombol" />
                </td>
            </tr>
        </table>

    </form>
    </div>
</body>
</html>
